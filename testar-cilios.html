<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1215">
<title>Pérola Beauty - Teste seus Cílios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Hind:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1215;--rose:#f3c8d2;--rose-d:#c98a9b;--txt:#f8eef0;--mut:#b9a0a7;--r:28px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Hind,system-ui,sans-serif}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(90% 50% at 50% -8%,#4a2a34 0%,transparent 70%),radial-gradient(60% 40% at 100% 100%,#2f1c24 0%,transparent 70%),var(--bg)}
main{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.brand{text-align:center;margin-bottom:12px}
.brand h1{font:400 clamp(2.3rem,9vw,3rem)/1.05 "Great Vibes",cursive;margin:6px 0 0;background:linear-gradient(100deg,#fff 0%,var(--rose) 45%,#fff 62%,var(--rose-d) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:2px 0 0;color:var(--rose);font-weight:500;font-size:1.02rem}
.pearl{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 9%,#fff4f6 24%,#f3c8d2 58%,#a9788a 100%);box-shadow:0 4px 14px rgba(243,200,210,.35),inset -2px -3px 5px rgba(90,50,64,.35)}
.pearl.big{width:76px;height:76px;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.frame{width:min(100%,460px);width:min(100%,calc(62svh*.75));padding:2px;border-radius:calc(var(--r) + 2px);background:linear-gradient(140deg,#fbe3e9,#c98a9b 38%,#4b2d37 62%,#f3c8d2);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.stage{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:#241820;touch-action:pan-y}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;background:radial-gradient(80% 60% at 50% 30%,#3a222b,#20141a)}
.overlay[hidden]{display:none}
.overlay h2{margin:0;font-weight:500;font-size:1.35rem}
.overlay p{margin:0;color:var(--mut);line-height:1.5;max-width:30ch}
#err{color:#ffb4b4}
.tag{position:absolute;left:14px;top:14px;z-index:1;padding:7px 14px;border-radius:999px;background:rgba(26,18,21,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-weight:500;font-size:.95rem;opacity:0;transition:opacity .3s}
body.live .tag{opacity:1}
.tag.pop{animation:pop .35s}
@keyframes pop{from{transform:translateY(6px)}}
.flash{position:absolute;inset:0;z-index:3;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .35s}
@keyframes fl{from{opacity:.85}to{opacity:0}}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;padding:14px 26px;border:0;border-radius:999px;font:500 1rem Hind,sans-serif;background:linear-gradient(120deg,#fbe3e9,#f3c8d2 50%,#d99bad);color:#2a1418;text-decoration:none;cursor:pointer;box-shadow:0 8px 24px rgba(201,138,155,.35)}
.cta[hidden]{display:none}
.cta svg,.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock{display:flex;align-items:flex-end;justify-content:center;gap:30px;margin:18px 0 6px;opacity:.4;pointer-events:none;transition:opacity .4s}
body.live .dock{opacity:1;pointer-events:auto}
.ib{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;color:var(--txt);border:0;padding:0;font:inherit;font-size:.8rem;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:none}
.ib i{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(243,200,210,.3);transition:transform .15s,background .15s}
.ib:active i,.ib.on i{transform:scale(.92);background:rgba(243,200,210,.25)}
.ib.shutter i{width:66px;height:66px;background:radial-gradient(circle at 35% 30%,#fff,#f3c8d2 70%);border:3px solid rgba(255,255,255,.35)}
.shutter svg{stroke:#3a1f29;width:24px;height:24px}
.cards{width:100%;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:12px 12px 8px;margin-top:8px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:140px;padding:12px 14px;border-radius:18px;font:inherit;color:var(--txt);background:rgba(255,255,255,.05);border:1px solid rgba(243,200,210,.22);cursor:pointer;transition:background .25s,border-color .25s,transform .25s}
.card b{font-weight:500}.card small{color:var(--mut);font-size:.85rem}
.card .dot{width:9px;height:9px;border-radius:50%;background:rgba(243,200,210,.3);margin-bottom:6px;transition:.25s}
.card[aria-pressed=true]{background:rgba(243,200,210,.14);border-color:var(--rose);transform:translateY(-2px)}
.card[aria-pressed=true] .dot{background:radial-gradient(circle at 30% 30%,#fff,var(--rose));box-shadow:0 0 10px rgba(243,200,210,.7)}
#desc{min-height:4.6em;width:100%;color:var(--mut);line-height:1.55;margin:8px 4px 0;text-align:center}
@media (prefers-reduced-motion:reduce){.pearl.big,.tag.pop,.flash.go{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <header class="brand">
    <span class="pearl" aria-hidden="true"></span>
    <h1>Pérola Beauty</h1>
    <p>Teste seus Cílios</p>
  </header>

  <div class="frame">
    <section class="stage" id="stage">
      <canvas id="c" aria-label="Sua câmera com o modelo de cílios aplicado"></canvas>
      <video id="v" playsinline muted></video>
      <div class="tag" id="tag"></div>
      <div class="flash" id="flash"></div>
      <div class="overlay" id="ov">
        <span class="pearl big" aria-hidden="true"></span>
        <h2>Veja como fica em você</h2>
        <p id="ovtxt">Escolha um modelo, abra a câmera e experimente ao vivo. A imagem fica só no seu aparelho.</p>
        <button id="start" class="cta"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Abrir câmera</button>
        <p id="err" role="alert"></p>
      </div>
    </section>
  </div>

  <div class="dock">
    <button class="ib" id="cmp" aria-label="Segure para ver sem cílios"><i><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></i>Segure: antes</button>
    <button class="ib shutter" id="snap" aria-label="Salvar foto"><i><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 20h14"/></svg></i>Salvar foto</button>
    <button class="ib" id="flip" aria-label="Virar câmera"><i><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4L4 9m0-4v4h4M4 13a8 8 0 0 0 14 4l2-2m0 4v-4h-4"/></svg></i>Virar câmera</button>
  </div>

  <div class="cards" id="chips" role="group" aria-label="Modelos de cílios"></div>
  <p id="desc"></p>
  <a id="wa" class="cta" hidden target="_blank" rel="noopener">Quero este modelo</a>
</main>

const EYES=[
 {up:[33,246,161,160,159,158,157,173,133],lo:[145,153]},
 {up:[263,466,388,387,386,385,384,398,362],lo:[374,380]}];

const $=id=>document.getElementById(id);
const v=$("v"),c=$("c"),ctx=c.getContext("2d");
let cur="4d",facing="user",stream=null,lm=null,lastT=-1,sm={},raf=0;

const WHATSAPP="";   /* opcional: número com DDI e DDD, ex.: "5579999999999" — ativa o botão "Quero este modelo" */
const TAGS={"4d":"Natural e delicado","fox":"Olhar levantado","5d":"Mais preenchimento","br":"Volume em Y","ff":"Fio a fio natural"};
Object.entries(STYLES).forEach(([k,s])=>{
  const b=document.createElement("button");b.className="card";b.dataset.k=k;
  b.innerHTML=`<span class="dot"></span><b>${s.nome}</b><small>${TAGS[k]||""}</small>`;
  b.onclick=()=>setModel(k,true);$("chips").appendChild(b);
});
function setModel(k,scroll){
  cur=k;const s=STYLES[k];
  document.querySelectorAll(".card").forEach(x=>{const on=x.dataset.k===k;x.setAttribute("aria-pressed",on);
    if(on&&scroll)x.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})});
  $("desc").textContent=s.desc;
  const t=$("tag");t.textContent=s.nome;t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");
  if(WHATSAPP){const wa=$("wa");wa.hidden=false;wa.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Olá, Pérola Beauty! Testei o "+s.nome+" e quero agendar.")}
}
function step(n){const ks=Object.keys(STYLES);setModel(ks[(ks.indexOf(cur)+n+ks.length)%ks.length],true)}
setModel(cur);
/* deslizar na foto ou usar as setas troca o modelo */
let sx0=null;const stg=$("stage");
stg.addEventListener("pointerdown",e=>{sx0=e.clientX});
stg.addEventListener("pointerup",e=>{if(sx0===null)return;const d=e.clientX-sx0;sx0=null;if(Math.abs(d)>60)step(d<0?1:-1)});
addEventListener("keydown",e=>{if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});
/* segurar para ver sem cílios */
const cmp=$("cmp"),setOff=x=>{window.__off=x;cmp.classList.toggle("on",x)};
cmp.addEventListener("pointerdown",e=>{e.preventDefault();setOff(true)});
["pointerup","pointerleave","pointercancel"].forEach(n=>cmp.addEventListener(n,()=>setOff(false)));


async function loadModel(){
  if(lm)return;
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  lm=await FaceLandmarker.createFromOptions(fs,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},
    runningMode:"VIDEO",numFaces:1});
}
async function openCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}},audio:false});
  v.srcObject=stream;await v.play();
  c.width=v.videoWidth;c.height=v.videoHeight;
}
$("start").onclick=async()=>{
  $("err").textContent="";$("ovtxt").textContent="Carregando o filtro…";$("start").hidden=true;
  try{await loadModel();await openCam();$("ov").hidden=true;document.body.classList.add("live");cancelAnimationFrame(raf);loop()}
  catch(e){
    $("start").hidden=false;$("start").textContent="Tentar de novo";
    $("ovtxt").textContent="Não foi possível abrir a câmera.";
    $("err").textContent=(location.protocol==="http:"&&location.hostname!=="localhost")?"O site precisa estar em HTTPS para usar a câmera.":"Permita o acesso à câmera no navegador e tente de novo.";
  }
};
$("flip").onclick=async()=>{if(!stream)return;facing=facing==="user"?"environment":"user";sm={};await openCam()};
$("snap").onclick=()=>{
  if(!stream)return;
  const o=document.createElement("canvas");o.width=c.width;o.height=c.height;const g=o.getContext("2d");
  g.drawImage(c,0,0);
  g.font=Math.round(c.width*.05)+'px "Great Vibes",cursive';g.fillStyle="rgba(255,238,242,.95)";g.textAlign="right";
  g.shadowColor="rgba(0,0,0,.5)";g.shadowBlur=8;g.fillText("Pérola Beauty",c.width*.96,c.height*.965);
  const a=document.createElement("a");a.download="perola-beauty-cilios.png";a.href=o.toDataURL("image/png");a.click();
  const f=$("flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");
};

/* pseudo-aleatório fixo (evita tremer) */
const rnd=(i,s)=>{const x=Math.sin(i*12.9898+s*78.233)*43758.5453;return x-Math.floor(x)};

const M=.12;
for(const k in STYLES){const im=new Image();im.src=window.TEX[k];STYLES[k].img=im}
const lc=document.createElement("canvas"),lx=lc.getContext("2d");
const blurOK="filter" in ctx;
const KEEP=[10,152,33,263];

/* suavização adaptativa: firme quando parado, acompanha quando mexe */
function smooth(idx,face){
  const fw=Math.hypot((face[33].x-face[263].x)*c.width,(face[33].y-face[263].y)*c.height)||100,o={};
  idx.forEach(i=>{
    const p=face[i],q={x:p.x*c.width,y:p.y*c.height},o0=sm[i];
    if(!o0)sm[i]=q;else{const d=Math.hypot(q.x-o0.x,q.y-o0.y)/fw,a=Math.min(.9,.22+d*14);
      sm[i]={x:o0.x+(q.x-o0.x)*a,y:o0.y+(q.y-o0.y)*a}}
    o[i]=sm[i];
  });
  return o;
}
function cr(P,f){
  const n=P.length-1;f=Math.max(0,Math.min(n,f));
  const i=Math.min(Math.floor(f),n-1),t=f-i,a=P[Math.max(i-1,0)],b=P[i],c=P[i+1],d=P[Math.min(i+2,n)];
  const q=(a,b,c,d)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
  return{x:q(a.x,b.x,c.x,d.x),y:q(a.y,b.y,c.y,d.y)};
}
function lidAt(P,u,arc){
  const n=P.length-1;
  if(u<0){const d=Math.hypot(P[0].x-P[1].x,P[0].y-P[1].y)||1;return{x:P[0].x+(P[0].x-P[1].x)/d*-u*arc,y:P[0].y+(P[0].y-P[1].y)/d*-u*arc}}
  if(u>1){const d=Math.hypot(P[n].x-P[n-1].x,P[n].y-P[n-1].y)||1;return{x:P[n].x+(P[n].x-P[n-1].x)/d*(u-1)*arc,y:P[n].y+(P[n].y-P[n-1].y)/d*(u-1)*arc}}
  return cr(P,u*n);
}

function drawEye(e,pts,S,ei,up){
  const g=lx,P=e.up.map(i=>pts[i]),L=e.lo.map(i=>pts[i]);
  const w=Math.hypot(P[0].x-P[8].x,P[0].y-P[8].y)||1;
  let arc=0;for(let i=1;i<P.length;i++)arc+=Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y);
  const low={x:(L[0].x+L[1].x)/2,y:(L[0].y+L[1].y)/2};
  /* olho fechando: os cílios descem junto com a pálpebra */
  const open=Math.hypot(P[4].x-low.x,P[4].y-low.y)/w,k=Math.max(0,Math.min(1,(open-.02)/.09)),sk=2*(k*k*(3-2*k))-1;
  /* raiz: sombra fina que some nas pontas, sem linha dura */
  const gr=g.createLinearGradient(P[0].x,P[0].y,P[8].x,P[8].y);
  gr.addColorStop(0,`rgba(${S.col},0)`);gr.addColorStop(.15,`rgba(${S.col},.4)`);
  gr.addColorStop(.7,`rgba(${S.col},.32)`);gr.addColorStop(1,`rgba(${S.col},0)`);
  g.strokeStyle=gr;g.lineWidth=w*.016;g.lineCap="round";g.beginPath();
  P.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();
  const im=S.img;if(!im.complete||!im.naturalWidth)return null;
  const tw=im.naturalWidth,th=im.naturalHeight;
  const NSL=Math.max(60,Math.min(240,Math.round(arc*(1+2*M)/2.2)));
  const sw=tw/NSL,Ht=arc*th*(1+2*M)/tw*(S.sc||1)*(ei?.95:1);
  const a0=lidAt(P,.48,arc),a1=lidAt(P,.52,arc);
  const sg=((a1.y-a0.y)*up.x-(a1.x-a0.x)*up.y)>=0?1:-1;   /* "fora" = lado da testa */
  const pos=[];for(let j=0;j<=NSL;j++)pos.push(lidAt(P,-M+(1+2*M)*j/NSL,arc));
  let X0=1e9,Y0=1e9,X1=-1e9,Y1=-1e9;
  for(let j=0;j<NSL;j++){
    const p0=pos[j],p1=pos[j+1],dx=p1.x-p0.x,dy=p1.y-p0.y,dl=Math.hypot(dx,dy)||1;
    const nx=sg*dy/dl*sk,ny=-sg*dx/dl*sk,sx=j*sw,sx0=Math.max(0,sx-2),sx1=Math.min(tw,sx+sw+2);
    g.setTransform(dx/sw,dy/sw,nx*Ht/th,ny*Ht/th,p0.x,p0.y);
    g.drawImage(im,sx0,0,sx1-sx0,th,sx0-sx,0,sx1-sx0,th);
    X0=Math.min(X0,p0.x,p0.x+nx*Ht);X1=Math.max(X1,p0.x,p0.x+nx*Ht);
    Y0=Math.min(Y0,p0.y,p0.y+ny*Ht);Y1=Math.max(Y1,p0.y,p0.y+ny*Ht);
  }
  g.setTransform(1,0,0,1,0,0);
  return[X0,Y0,X1,Y1];
}

function loop(){
  raf=requestAnimationFrame(loop);
  if(v.readyState<2)return;
  if(c.width!==v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight}
  if(lc.width!==c.width){lc.width=c.width;lc.height=c.height}
  ctx.save();
  if(facing==="user"){ctx.translate(c.width,0);ctx.scale(-1,1)}
  ctx.drawImage(v,0,0,c.width,c.height);
  if(v.currentTime!==lastT){
    lastT=v.currentTime;
    const r=lm.detectForVideo(v,performance.now());
    loop.face=r.faceLandmarks&&r.faceLandmarks[0];
  }
  if(loop.face&&!window.__off){
    const all=EYES.flatMap(e=>e.up.concat(e.lo)).concat(KEEP),pts=smooth(all,loop.face);
    let ux=pts[10].x-pts[152].x,uy=pts[10].y-pts[152].y;const ul=Math.hypot(ux,uy)||1;const up={x:ux/ul,y:uy/ul};
    let bb=null;
    EYES.forEach((e,ei)=>{const r=drawEye(e,pts,STYLES[cur],ei,up);
      if(r)bb=bb?[Math.min(bb[0],r[0]),Math.min(bb[1],r[1]),Math.max(bb[2],r[2]),Math.max(bb[3],r[3])]:r});
    if(bb){
      const x0=Math.max(0,Math.floor(bb[0]-8)),y0=Math.max(0,Math.floor(bb[1]-8));
      const w=Math.min(c.width,Math.ceil(bb[2]+8))-x0,h=Math.min(c.height,Math.ceil(bb[3]+8))-y0;
      if(w>0&&h>0){
        ctx.globalAlpha=.94;if(blurOK)ctx.filter="blur(0.6px)";   /* suaviza p/ combinar com a câmera */
        ctx.drawImage(lc,x0,y0,w,h,x0,y0,w,h);
        ctx.filter="none";ctx.globalAlpha=1;lx.clearRect(x0,y0,w,h);
      }
    }
  }
  ctx.restore();
}
</script>
</body>
